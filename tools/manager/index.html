<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마녀 모이라 제작실</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script><script src="/drafts.js" defer></script><script src="/playlog.js" defer></script></head>
<body><a class="skip" href="#workspace">목록으로 이동</a>
<header class="masthead"><div><span class="sigil" aria-hidden="true"><svg viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M6 54V25a18 18 0 0 1 36 0v29M15 54V26a9 9 0 0 1 18 0v28M2 54h44M24 1v9M7 9l7 7M41 9l-7 7" stroke="currentColor" stroke-width="2"/></svg></span><h1>마녀 모이라 <span>제작실</span></h1></div></header>
<section class="order" aria-label="안내"><div><span class="live-dot"></span><strong id="basis">불러오는 중</strong><span id="generated"></span></div><p>화면에 보이는 것은 지금 게임 폴더의 파일을 읽은 내용입니다. 수치는 여기서 고치지 않습니다.</p></section>
<div class="shell"><aside class="rail"><div class="rail-title">무엇이 들어 있나</div><button class="view-button active" data-all="1">전체 <span id="total-count">—</span></button><nav id="categories" aria-label="분류"></nav><button id="open-gallery" class="view-button gallery-open" type="button">원화 시안 <span id="gallery-count"></span></button><button id="open-playlog" class="view-button gallery-open" type="button">플레이 기록 <span id="playlog-count"></span></button><footer><button id="reload" class="quiet">게임 폴더 다시 읽기</button></footer></aside>
<main id="workspace"><section class="workspace-head"><div><p id="view-context">전체</p><h2 id="view-title">게임에 들어 있는 것</h2></div><span id="result-count" aria-live="polite"></span></section>
<section class="filters" aria-label="검색과 거르기"><label class="search">검색<input id="search" type="search" placeholder="이름이나 내용으로 찾기" autocomplete="off"></label><label>내 메모 상태<select id="status-filter"><option value="">전체</option><option value="todo">대기</option><option value="in_progress">진행 중</option><option value="review">검토</option><option value="done">완료(메모)</option><option value="deferred">후순위</option></select></label><label>게임에서 쓰임<select id="usage-filter"><option value="">전체</option></select></label></section>
<div id="notice" role="status" aria-live="polite"></div>
<section class="ledger"><div class="list-heading"><span>항목</span><span>메모 상태</span></div><div id="list" aria-label="항목 목록"><p class="empty">불러오고 있습니다.</p></div></section></main>
<section id="gallery" class="gallery" aria-label="원화 시안" hidden></section>
<section id="playlog" class="playlog" aria-label="플레이 기록" hidden></section>
<aside id="inspector" class="inspector" aria-label="항목 상세"><div class="inspector-empty"><h2>항목을 고르세요</h2><p>수치, 미리보기, 출처, 내 메모를 여기서 봅니다.</p></div></aside></div><noscript>제작실을 쓰려면 자바스크립트를 켜세요.</noscript></body></html>
